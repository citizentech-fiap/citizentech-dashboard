# Configuração do painel Mandacaru (caminhos relativos à pasta dashboard/).

paths:
  municipios: data/municipios_semiarido.csv     # 23 municípios (IBGE + coordenadas)
  malhas: data/malhas_municipios.geojson        # polígonos IBGE dos 23 municípios
  clima_diario: data/clima_diario.csv           # chuva e ET0 diárias por município (Open-Meteo, estações)
  climatologia: data/climatologia.csv           # normal 1991–2020 por município e dia do ano
  pedidos_snapshot: data/pedidos_safra.csv      # pedidos de uma safra simulada (mesmo formato do robô)
  rpa_controle: ../RPA/output/controle.xlsx     # planilha viva do robô (fonte "rpa")
  decisoes: output/decisoes.jsonl               # registro de auditoria das decisões do gestor
  convocacoes: output/convocacoes               # mensagens aprovadas (.eml)
  cache_http: data/cache_http                   # cache das chamadas às APIs
  genai_path: ../genAI

fontes:
  pedidos: snapshot          # snapshot (safra simulada) | rpa (planilha viva do robô)
  timeout_s: 30
  retries: 3

safra:
  inicio_mes_dia: "01-01"    # estação chuvosa do sertão: janeiro a junho
  fim_mes_dia: "06-30"
  anos_disponiveis: [2012, 2013, 2016, 2019, 2020, 2024, 2025, 2026]
  ano_padrao: 2026
  ano_demo_seca: 2012        # a grande seca: modo demonstração
  normal_inicio: 1991
  normal_fim: 2020

# Estimativa da perda por estresse hídrico — resposta da produção ao déficit hídrico (FAO, Boletim 33):
#   perda = Ky * (1 - ETa/ETc), ETc = Kc * ET0, ETa = min(ETc, chuva_efetiva), chuva_efetiva = fator * chuva
# É uma aproximação do indicador "Modelo de Penalização Hídrica (INMET)" usado pelo Garantia-Safra,
# NÃO o modelo oficial. Por isso a vistoria (o outro indicador) é decisão humana no painel.
modelo_hidrico:
  fator_chuva_efetiva: 0.8
  dia_seco_mm: 1.0
  culturas:
    milho: {ky: 1.25, kc: 0.85, nome: "Milho"}
    feijao: {ky: 1.15, kc: 0.80, nome: "Feijão"}
  cultura_padrao: milho

risco:
  criterio_garantia_safra: 40      # perda mínima (%) em cada um de dois indicadores (Carta de Serviço)
  classes:                          # limites inferiores de perda estimada (%)
    seguro: 0
    atencao: 20
    alerta: 40
    critico: 60

recomendacoes:
  min_pedidos_mutirao: 10          # mutirão de CAF só se houver pelo menos N pedidos travados por falta de CAF
  pesos_prioridade: {risco: 0.5, familias: 0.3, gargalo: 0.2}
