# Configuração do painel Mandacaru (caminhos relativos à pasta dashboard/).

paths:
  municipios: data/municipios_semiarido.csv     # 23 municípios (IBGE + coordenadas)
  malhas: data/malhas_municipios.geojson        # polígonos IBGE dos 23 municípios
  clima_diario: data/clima_diario.csv           # chuva e ET0 diárias por município (Open-Meteo, reanálise)
  climatologia: data/climatologia.csv           # normal 1991–2020 por município e dia do ano
  pedidos_snapshot: data/pedidos_safra.csv      # pedidos de uma safra simulada (mesmo formato do robô)
  rpa_controle: ../RPA/output/controle.xlsx     # planilha viva do robô (fonte "rpa")
  decisoes: output/decisoes.jsonl               # registro de auditoria das decisões do gestor
  convocacoes: output/convocacoes               # mensagens aprovadas (.eml)
  cache_http: data/cache_http                   # cache das chamadas às APIs
  genai_path: ../genAI
  pam: data/pam_municipios.csv
  garantia_safra: data/garantia_safra_pagamentos.csv
  garantia_safra_cobertura: data/garantia_safra_cobertura.json

fontes:
  pedidos: snapshot          # snapshot (safra simulada) | rpa (planilha viva do robô)
  timeout_s: 30
  retries: 3
  backoff_s: 2               # espera exponencial entre tentativas HTTP
  intervalo_normal_s: 15     # consultas de 30 anos têm maior custo no limite Open-Meteo
  intervalo_download_s: 15
  backoff_download_s: 60     # pausa exponencial se o download da CGU responder 405
  pam_inicio: 2002
  pam_fim: 2025
  pagamentos_inicio: "2012-01"
  pagamentos_fim: "2026-10"

safra:
  inicio_mes_dia: "01-01"    # estação chuvosa do sertão: janeiro a junho
  fim_mes_dia: "06-30"
  inicio_estimativa: "03-01"
  anos_disponiveis: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  ano_padrao: 2026
  ano_demo_seca: 2012        # a grande seca: modo demonstração
  normal_inicio: 1991
  normal_fim: 2020

# Estimativa acadêmica: resposta FAO-33 adaptada ao ISNA relativo à normal 1991–2020.
# ISNA = ETa/ETc; ETc = Kc * ET0; ETa = min(ETc, fator * chuva), para ano e normal.
# perda (%) = clip(100 * Ky * (1 - ISNA_ano/ISNA_normal), 0, 100).
# Chuva e ET0 da normal cobrem o mesmo período (inclusive no replay até a data).
# Não penaliza o déficit estrutural de um ano igual à normal. Não é o modelo oficial
# INMET nem comprova direito ao Garantia-Safra; vistoria e pagamento são decisões externas.
modelo_hidrico:
  fator_chuva_efetiva: 0.8
  dia_seco_mm: 1.0
  culturas:
    milho: {ky: 1.25, kc: 0.85, nome: "Milho"}
    feijao: {ky: 1.15, kc: 0.80, nome: "Feijão"}
  cultura_padrao: milho

risco:
  criterio_garantia_safra: 40      # perda mínima (%) em cada um de dois indicadores (Carta de Serviço)
  classes:                          # limites inferiores de perda estimada (%)
    seguro: 0
    atencao: 20
    alerta: 40
    critico: 60
  classes_chuva:                    # fronteiras de anomalia (%)
    seguro: 0                      # >= 0; déficit leve até -20 é atenção
    atencao: -20
    alerta: -40                    # abaixo deste limite: crítico

realidade:
  anos_media: 10
  maiores_divergencias: 10

recomendacoes:
  min_pedidos_mutirao: 10          # mutirão de CAF só se houver pelo menos N pedidos travados por falta de CAF
  pesos_prioridade: {risco: 0.5, familias: 0.3, gargalo: 0.2}

decisoes:
  usuario_padrao: coordenacao
  dia_semana_sugerido: 0          # segunda-feira; inclui hoje se já for segunda
  local_sugerido: "Sede da EMATER de {municipio}, 8h"

# Exclusivamente para a demonstração: nenhum pedido representa pessoa real.
simulacao:
  seed: 42
  pedidos_por_ano: 1000
  peso_volume_base: 1.0
  peso_volume_perda: 3.0
  prob_sem_caf: 0.33
  prob_outro_doc_faltante: 0.18
  prob_doc_ilegivel: 0.05
  prob_revisao_adicional: 0.08
  confianca_min: 0.70
  confianca_max: 0.99
  # Peso final dos três primeiros serviços cresce proporcionalmente à perda.
  incremento_servicos_seca: 2.0
  pesos_servicos:
    garantia_safra: 4
    caf: 2
    pronaf: 2
    cadunico: 1
    bolsa_familia: 1
    bpc: 1
    aposentadoria_rural: 1
    salario_maternidade_rural: 1
    cpf: 1

# Comportamento da interface e cache da camada Streamlit.
interface:
  cache_dados_ttl_s: 3600
  cache_rede_ttl_s: 900
  cache_rag_ttl_s: 3600
  recomendacoes_por_pagina: 5
  mini_graficos: 3
  altura_mapa: 480
  mapa_centro: {lat: -8.1, lon: -39.7}
  mapa_zoom: 5.1
  mapa_estilo: carto-positron   # base neutra sem token; "white-bg" para uso offline
  altura_chuva: 400
  altura_mini: 150
  altura_barras: 230
  limiar_min: 0
  limiar_max: 100
  limiar_passo: 5
